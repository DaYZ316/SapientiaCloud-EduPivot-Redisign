name: sc-edupivot

x-java-service: &java-service
  build:
    context: .
    dockerfile: deploy/artifact/java-runtime.Dockerfile
    args:
      JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
      SKYWALKING_AGENT_IMAGE: ${SKYWALKING_AGENT_IMAGE:-apache/skywalking-java-agent:9.6.0-java21}
  image: sc-edupivot-java-runtime:latest
  restart: unless-stopped
  working_dir: /app
  networks:
    - sc-edupivot-net

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_USERNAME: ${NACOS_USERNAME}
  NACOS_PASSWORD: ${NACOS_PASSWORD}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TZ: Asia/Shanghai
  JAVA_OPTS: ${JAVA_OPTS:-}
  JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800

services:
  sc-frontend:
    image: ${FRONTEND_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: SC-Frontend
    restart: unless-stopped
    depends_on:
      sc-gateway:
        condition: service_healthy
    ports:
      - "${EDUPIVOT_HTTP_PORT:-80}:80"
      - "${EDUPIVOT_HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/artifact/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EDUPIVOT_SSL_CERT_DIR:-/etc/nginx/cert}:/etc/nginx/cert:ro
    networks:
      - sc-edupivot-net

  nacos-config-init:
    image: python:3.13-alpine
    container_name: SC-Nacos-Config-Init
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_CONFIG_DIR: /nacos-config
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGENT_SEARCH_WEB_SEARCH_ENABLED: ${AGENT_SEARCH_WEB_SEARCH_ENABLED:-true}
      AGENT_SEARCH_WEB_SEARCH_ENDPOINT: ${AGENT_SEARCH_WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      AGENT_SEARCH_WEB_SEARCH_API_KEY: ${AGENT_SEARCH_WEB_SEARCH_API_KEY:-}
      AGENT_SEARCH_WEB_SEARCH_MAX_RESULTS: ${AGENT_SEARCH_WEB_SEARCH_MAX_RESULTS:-5}
      AGENT_SEARCH_WEB_SEARCH_TIMEOUT: ${AGENT_SEARCH_WEB_SEARCH_TIMEOUT:-5s}
      AGENT_SEARCH_WEB_SEARCH_MAX_SNIPPET_CHARS: ${AGENT_SEARCH_WEB_SEARCH_MAX_SNIPPET_CHARS:-500}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://edupivot.xyz/livekit}
      LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - ./nacos-config:/nacos-config:ro
      - ./scripts/nacos_config_init.py:/nacos_config_init.py:ro
    entrypoint:
      - python
      - /nacos_config_init.py
    restart: "no"
    networks:
      - sc-edupivot-net

  sc-auth:
    <<: *java-service
    container_name: SC-Auth
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      SW_AGENT_NAME: sc-edupivot-auth
      REDIS_HOST: redis
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    volumes:
      - ./jars/sc-auth.jar:/app/app.jar:ro
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_AUTH_PORT:-28081}:28081"
    command: >
      sh -c 'if [ -n "$$JWT_PRIVATE_KEY_B64" ]; then export JWT_PRIVATE_KEY="$$(printf "%s" "$$JWT_PRIVATE_KEY_B64" | base64 -d)"; fi; exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28081/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sc-notification:
    <<: *java-service
    container_name: SC-Notification
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
    environment:
      <<: *java-env
      SW_AGENT_NAME: sc-edupivot-notification
      REDIS_HOST: redis
    volumes:
      - ./jars/sc-notification.jar:/app/app.jar:ro
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_NOTIFICATION_PORT:-28082}:28082"
    command: >
      sh -c 'exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28082/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sc-course:
    <<: *java-service
    container_name: SC-Course
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
    environment:
      <<: *java-env
      SW_AGENT_NAME: sc-edupivot-course
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://edupivot.xyz/livekit}
      LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      SERVER_PORT: 28084
    volumes:
      - ./jars/sc-course.jar:/app/app.jar:ro
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_COURSE_PORT:-28084}:28084"
    command: >
      sh -c 'exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28084/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sc-storage:
    <<: *java-service
    container_name: SC-Storage
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
      sc-course:
        condition: service_healthy
    environment:
      <<: *java-env
      SW_AGENT_NAME: sc-edupivot-storage
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      SERVER_PORT: 28085
    volumes:
      - ./jars/sc-storage.jar:/app/app.jar:ro
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_STORAGE_PORT:-28085}:28085"
    command: >
      sh -c 'exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28085/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sc-ai:
    <<: *java-service
    container_name: SC-AI
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
      sc-storage:
        condition: service_healthy
    environment:
      <<: *java-env
      SW_AGENT_NAME: sc-edupivot-ai
      REDIS_HOST: redis
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-missing-dashscope-key}
      SPRING_AI_OPENAI_API_KEY: ${DASHSCOPE_API_KEY:-missing-dashscope-key}
      AGENT_SEARCH_WEB_SEARCH_ENABLED: ${AGENT_SEARCH_WEB_SEARCH_ENABLED:-true}
      AGENT_SEARCH_WEB_SEARCH_ENDPOINT: ${AGENT_SEARCH_WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      AGENT_SEARCH_WEB_SEARCH_API_KEY: ${AGENT_SEARCH_WEB_SEARCH_API_KEY:-}
      SERVER_PORT: 28086
    volumes:
      - ./jars/sc-ai.jar:/app/app.jar:ro
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_AI_PORT:-28086}:28086"
    command: >
      sh -c 'exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28086/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sc-gateway:
    <<: *java-service
    container_name: SC-Gateway
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
      sc-notification:
        condition: service_healthy
      sc-course:
        condition: service_healthy
      sc-storage:
        condition: service_healthy
      sc-ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:-}
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: sc-edupivot-gateway
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
    ports:
      - "${EDUPIVOT_BACKEND_BIND_HOST:-127.0.0.1}:${EDUPIVOT_GATEWAY_PORT:-39080}:${EDUPIVOT_GATEWAY_PORT:-39080}"
    volumes:
      - ./jars/sc-gateway.jar:/app/app.jar:ro
    command: >
      sh -c 'exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:39080/actuator/health/liveness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: SC-Nacos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_USERNAME: ${NACOS_USERNAME}
      NACOS_AUTH_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: unused
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: unused
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8
      MYSQL_SERVICE_USER: ${POSTGRES_USER}
      MYSQL_SERVICE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPT_EXT: >-
        --spring.datasource.platform=postgresql
        --spring.sql.init.platform=postgresql
        --db.pool.config.driverClassName=org.postgresql.Driver
        --db.url.0=jdbc:postgresql://postgres:5432/${NACOS_POSTGRES_DB}?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=nacos_java
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${NACOS_PORT}:8848"
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${NACOS_GRPC_PORT}:9848"
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${NACOS_RAFT_PORT}:9849"
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${NACOS_CONSOLE_PORT}:8080"
    volumes:
      - ./nacos-plugins:/home/nacos/plugins:ro
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8848/nacos" ]
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - sc-edupivot-net

  postgres:
    image: postgis/postgis:17-3.5
    container_name: SC-PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: SC-Redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  skywalking-banyandb:
    image: apache/skywalking-banyandb:0.10.2
    container_name: SC-SkyWalking-BanyanDB
    restart: unless-stopped
    command: standalone
    networks:
      - sc-edupivot-net

  skywalking-oap:
    image: apache/skywalking-oap-server:10.4.0-java21
    container_name: SC-SkyWalking-OAP
    restart: unless-stopped
    depends_on:
      skywalking-banyandb:
        condition: service_started
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      TZ: Asia/Shanghai
    expose:
      - "11800"
      - "12800"
    networks:
      - sc-edupivot-net

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0
    container_name: SC-SkyWalking-UI
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_started
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${SKYWALKING_UI_PORT:-18090}:8080"
    networks:
      - sc-edupivot-net

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: SC-Prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sc-edupivot-net

  grafana:
    image: grafana/grafana:12.3.0
    container_name: SC-Grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - sc-edupivot-net

  livekit-config-init:
    image: python:3.13-alpine
    container_name: SC-LiveKit-Config-Init
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
      LIVEKIT_RTC_UDP_PORT: ${LIVEKIT_RTC_UDP_PORT:-7882}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - livekit-config:/livekit-config
    entrypoint:
      - python
      - -c
      - |
        import json
        import os
        from pathlib import Path

        api_key = os.environ.get("LIVEKIT_API_KEY", "").strip()
        api_secret = os.environ.get("LIVEKIT_API_SECRET", "").strip()
        if not api_key or not api_secret:
            raise SystemExit("LIVEKIT_API_KEY and LIVEKIT_API_SECRET must be set")

        tcp_port = int(os.environ.get("LIVEKIT_RTC_TCP_PORT", "7881"))
        udp_port = int(os.environ.get("LIVEKIT_RTC_UDP_PORT", "7882"))
        redis_password = os.environ.get("REDIS_PASSWORD", "")

        config = "\n".join([
            "port: 7880",
            "bind_addresses:",
            '  - ""',
            "rtc:",
            f"  tcp_port: {tcp_port}",
            f"  udp_port: {udp_port}",
            "  use_external_ip: true",
            "redis:",
            "  address: redis:6379",
            f"  password: {json.dumps(redis_password)}",
            "keys:",
            f"  {json.dumps(api_key)}: {json.dumps(api_secret)}",
            "",
        ])
        Path("/livekit-config/livekit.yaml").write_text(config, encoding="utf-8")
    restart: "no"
    networks:
      - sc-edupivot-net

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    container_name: SC-LiveKit
    restart: unless-stopped
    depends_on:
      livekit-config-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: [ "--config", "/livekit-config/livekit.yaml" ]
    volumes:
      - livekit-config:/livekit-config:ro
    ports:
      - "${LIVEKIT_API_BIND_HOST:-127.0.0.1}:${LIVEKIT_HTTP_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
    networks:
      - sc-edupivot-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: SC-Kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sc-edupivot-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: SC-MinIO
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT}:9000"
      - "${EDUPIVOT_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CORS_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:5173}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/edupivot-media || true
        mc mb -p local/edupivot-course || true
        mc mb -p local/edupivot-ai || true
        mc anonymous set none local/edupivot-media || true
        mc anonymous set none local/edupivot-course || true
        mc anonymous set none local/edupivot-ai || true
        mc anonymous set download local/edupivot-media/user-avatar || true
        mc anonymous set download local/edupivot-media/course-cover || true
        cat > /tmp/cors.json <<EOF
        [
          {
            "AllowedOrigins": ["$$MINIO_CORS_ORIGIN"],
            "AllowedMethods": ["GET", "HEAD", "POST", "PUT"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag"],
            "MaxAgeSeconds": 3600
          }
        ]
        EOF
        mc cors set local/edupivot-media /tmp/cors.json
        mc cors set local/edupivot-course /tmp/cors.json
        mc cors set local/edupivot-ai /tmp/cors.json
        mc ilm add local/edupivot-media --prefix "temp/" --expire-days "1" || true
        mc ilm add local/edupivot-course --prefix "temp/" --expire-days "1" || true
        mc ilm add local/edupivot-ai --prefix "temp/" --expire-days "1" || true
    networks:
      - sc-edupivot-net

volumes:
  postgres-data:
    name: SC-PostgreSQL-Data
  redis-data:
    name: SC-Redis-Data
  minio-data:
    name: SC-MinIO-Data
  nacos-data:
    name: SC-Nacos-Data
  nacos-logs:
    name: SC-Nacos-Logs
  kafka-data:
    name: SC-Kafka-Data
  livekit-config:
    name: SC-LiveKit-Config
  prometheus-data:
    name: SC-Prometheus-Data
  grafana-data:
    name: SC-Grafana-Data

networks:
  sc-edupivot-net:
    name: SC-Network
    driver: bridge
