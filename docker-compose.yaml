name: sc-edupivot

services:
  sc-frontend:
    build:
      context: .
      dockerfile: sc-frontend/Dockerfile
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:1.27-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        VITE_GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
        VITE_GITHUB_SCOPE: ${GITHUB_SCOPE:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    image: sc-frontend:latest
    container_name: SC-Frontend
    restart: unless-stopped
    depends_on:
      sc-gateway:
        condition: service_healthy
    ports:
      - "${EDUPIVOT_FRONTEND_PORT:-5173}:80"
    networks:
      - sc-edupivot-net

  sc-auth:
    build:
      context: .
      dockerfile: sc-auth/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    image: sc-auth:latest
    container_name: SC-Auth
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_AUTH_PORT:-28081}:28081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:28081/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - sc-edupivot-net

  sc-notification:
    build:
      context: .
      dockerfile: sc-notification/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    image: sc-notification:latest
    container_name: SC-Notification
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_NOTIFICATION_PORT:-28082}:28082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:28082/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - sc-edupivot-net

  sc-course:
    build:
      context: .
      dockerfile: sc-course/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    image: sc-course:latest
    container_name: SC-Course
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: 28084
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_COURSE_PORT:-28084}:28084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:28084/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - sc-edupivot-net

  sc-storage:
    build:
      context: .
      dockerfile: sc-storage/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    image: sc-storage:latest
    container_name: SC-Storage
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
      sc-course:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      SERVER_PORT: 28085
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_STORAGE_PORT:-28085}:28085"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:28085/actuator/health/liveness || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - sc-edupivot-net

  sc-gateway:
    build:
      context: .
      dockerfile: sc-gateway/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    image: sc-gateway:latest
    container_name: SC-Gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      sc-auth:
        condition: service_healthy
      sc-notification:
        condition: service_healthy
      sc-course:
        condition: service_healthy
      sc-storage:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      EDUPIVOT_SECURITY_JWT_JWKS_URI: http://sc-auth:28081/.well-known/jwks.json
      TZ: Asia/Shanghai
    ports:
      - "${EDUPIVOT_GATEWAY_PORT:-39080}:${EDUPIVOT_GATEWAY_PORT:-39080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:39080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - sc-edupivot-net

  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: SC-Nacos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_USERNAME: ${NACOS_USERNAME}
      NACOS_AUTH_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: unused
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: unused
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8
      MYSQL_SERVICE_USER: ${POSTGRES_USER}
      MYSQL_SERVICE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPT_EXT: >-
        --spring.datasource.platform=postgresql
        --spring.sql.init.platform=postgresql
        --db.pool.config.driverClassName=org.postgresql.Driver
        --db.url.0=jdbc:postgresql://postgres:5432/${NACOS_POSTGRES_DB}?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=nacos_java
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
      - "${NACOS_RAFT_PORT}:9849"
      - "${NACOS_CONSOLE_PORT}:8080"
    volumes:
      - ./nacos-plugins:/home/nacos/plugins:ro
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8848/nacos" ]
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - sc-edupivot-net

  postgres:
    image: postgis/postgis:17-3.5
    container_name: SC-PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  redis:
    image: redis:8-alpine
    container_name: SC-Redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  zipkin:
    image: openzipkin/zipkin:3
    container_name: SC-Zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - sc-edupivot-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: SC-Kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_RETENTION_HOURS: 168
      TZ: Asia/Shanghai
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sc-edupivot-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: SC-MinIO
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-edupivot-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CORS_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:5173}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/edupivot-media || true
        mc mb -p local/edupivot-course || true
        mc mb -p local/edupivot-ai || true
        mc anonymous set none local/edupivot-media || true
        mc anonymous set none local/edupivot-course || true
        mc anonymous set none local/edupivot-ai || true
        mc anonymous set download local/edupivot-media/user-avatar || true
        mc anonymous set download local/edupivot-media/course-cover || true
        cat > /tmp/cors.json <<EOF
        [
          {
            "AllowedOrigins": ["$$MINIO_CORS_ORIGIN"],
            "AllowedMethods": ["GET", "HEAD", "POST", "PUT"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag"],
            "MaxAgeSeconds": 3600
          }
        ]
        EOF
        mc cors set local/edupivot-media /tmp/cors.json
        mc cors set local/edupivot-course /tmp/cors.json
        mc cors set local/edupivot-ai /tmp/cors.json
        mc ilm add local/edupivot-media --prefix "temp/" --expire-days "1" || true
        mc ilm add local/edupivot-course --prefix "temp/" --expire-days "1" || true
        mc ilm add local/edupivot-ai --prefix "temp/" --expire-days "1" || true
    networks:
      - sc-edupivot-net

volumes:
  postgres-data:
    name: SC-PostgreSQL-Data
  redis-data:
    name: SC-Redis-Data
  minio-data:
    name: SC-MinIO-Data
  nacos-data:
    name: SC-Nacos-Data
  nacos-logs:
    name: SC-Nacos-Logs
  kafka-data:
    name: SC-Kafka-Data

networks:
  sc-edupivot-net:
    name: SC-Network
    driver: bridge
