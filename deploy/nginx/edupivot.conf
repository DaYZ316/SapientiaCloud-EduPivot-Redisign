map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $desktop_cors_origin {
    default         "";
    "edupivot://app" $http_origin;
    "https://localhost" $http_origin;
}

server {
    listen 80;
    server_name edupivot.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name edupivot.xyz;

    ssl_certificate /etc/nginx/cert/edupivot.xyz.pem;
    ssl_certificate_key /etc/nginx/cert/edupivot.xyz.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1000m;

    error_page 418 = @desktop_preflight;
    if ($request_method = OPTIONS) {
        return 418;
    }

    add_header Access-Control-Allow-Origin $desktop_cors_origin always;
    add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length, ETag" always;
    add_header Vary "Origin" always;

    # OAuth authorization codes must not be cached, logged, or sent as a referrer.
    location = /oauth/github/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth/github/mobile/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location ^~ /livekit/ {
        proxy_pass http://127.0.0.1:7880/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ^~ /api/class-sessions/seats/ws {
        proxy_pass http://127.0.0.1:28084;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /api/live-practices/subscribe {
        proxy_pass http://127.0.0.1:39080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering no always;
        add_header Access-Control-Allow-Origin $desktop_cors_origin always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length, ETag" always;
        add_header Vary "Origin" always;
    }

    location ~ ^/api/(notifications/subscribe|live-practices/subscribe|ai/chat|ai/conversations/[^/]+/messages/[^/]+/generation-progress|ai/live-summaries/class-sessions/[^/]+/stream) {
        proxy_pass http://127.0.0.1:39080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering no always;
        add_header Access-Control-Allow-Origin $desktop_cors_origin always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length, ETag" always;
        add_header Vary "Origin" always;
    }

    location ~ ^/api/ai/live-summaries/class-sessions/[^/]+/audio$ {
        proxy_pass http://127.0.0.1:39080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/api/class-sessions/[^/]+/barrages/stream$ {
        proxy_pass http://127.0.0.1:39080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering no always;
        add_header Access-Control-Allow-Origin $desktop_cors_origin always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length, ETag" always;
        add_header Vary "Origin" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:39080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(edupivot-media|edupivot-course|edupivot-ai)(/.*)?$ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location @desktop_preflight {
        add_header Access-Control-Allow-Origin $desktop_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control, Last-Event-ID" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name livekit.edupivot.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name livekit.edupivot.xyz;

    ssl_certificate /etc/nginx/cert/edupivot.xyz.pem;
    ssl_certificate_key /etc/nginx/cert/edupivot.xyz.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
