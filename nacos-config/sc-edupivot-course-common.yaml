server:
  port: 28084

spring:
  flyway:
    table: flyway_schema_history_course
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sc-course
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dayz.sc.common.events.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
    com.alibaba.nacos.plugin: WARN
    com.dayz.sc.common.web.filter.ApiRequestDebugLoggingFilter: INFO

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,diskSpace
springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.dayz.sc.course
  paths-to-match: /api/**
  writer-with-order-by-keys: true

scalar:
  enabled: true

resilience4j:
  circuitbreaker:
    instances:
      sc-storage:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10

edupivot:
  web:
    api-request-logging:
      enabled: ${API_REQUEST_DEBUG_LOGGING_ENABLED:false}
  livekit:
    url: ${LIVEKIT_URL:}
    server-url: ${LIVEKIT_SERVER_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    token-ttl: 2h
  security:
    trust-gateway-headers: true
    jwt:
      jwks-uri: http://sc-auth:28081/.well-known/jwks.json
    public-endpoints:
      - /api/courses/*
      - /api/courses
      - /api/class-sessions/seats/ws
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
      - /actuator/prometheus
      - /doc.html
      - /scalar
      - /scalar.js
      - /scalar/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /error
