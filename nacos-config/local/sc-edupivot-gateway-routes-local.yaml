spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ── 内部端点拦截（返回 403）──
            - id: block-storage-internal
              uri: no://op
              order: -100
              predicates:
                - Path=/api/storage/internal/**
              filters:
                - SetStatus=403
            - id: block-auth-internal
              uri: no://op
              order: -100
              predicates:
                - Path=/api/auth/**/internal/**
              filters:
                - SetStatus=403
            # ── 业务路由 ──
            - id: auth-route
              uri: lb://sc-auth
              predicates:
                - Path=/api/auth/**
            - id: notification-route
              uri: lb://sc-notification
              predicates:
                - Path=/api/notifications/**
            - id: course-route
              uri: lb://sc-course
              predicates:
                - Path=/api/courses/**,/api/enrollments/**,/api/chapters/**,/api/forums/**,/api/question-banks/**,/api/invitations/**
            - id: storage-route
              uri: lb://sc-storage
              predicates:
                - Path=/api/storage/**
            # ── OpenAPI 文档路由 ──
            - id: auth-openapi-route
              uri: lb://sc-auth
              predicates:
                - Path=/openapi/auth
              filters:
                - SetPath=/v3/api-docs
            - id: notification-openapi-route
              uri: lb://sc-notification
              predicates:
                - Path=/openapi/notification
              filters:
                - SetPath=/v3/api-docs
            - id: course-openapi-route
              uri: lb://sc-course
              predicates:
                - Path=/openapi/course
              filters:
                - SetPath=/v3/api-docs
            - id: storage-openapi-route
              uri: lb://sc-storage
              predicates:
                - Path=/openapi/storage
              filters:
                - SetPath=/v3/api-docs
