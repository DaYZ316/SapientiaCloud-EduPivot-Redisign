server:
  port: 39080

spring:
  threads:
    virtual:
      enabled: true

logging:
  level:
    com.alibaba.nacos.plugin: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis,diskSpace
scalar:
  enabled: true
  path: /scalar
  page-title: 智语·云枢 API 文档
  show-sidebar: true
  persist-auth: true
  telemetry: false
  sources:
    - title: 认证服务
      slug: auth
      url: /openapi/auth
      default: true
    - title: 通知服务
      slug: notification
      url: /openapi/notification
    - title: 课程服务
      slug: course
      url: /openapi/course
    - title: 存储服务
      slug: storage
      url: /openapi/storage
    - title: AI 服务
      slug: ai
      url: /openapi/ai

edupivot:
  security:
    jwt:
      jwks-uri: http://localhost:28081/.well-known/jwks.json
