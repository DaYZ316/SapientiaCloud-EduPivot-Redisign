server:
  port: 28081

spring:
  flyway:
    table: flyway_schema_history_auth
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          github-oauth-client:
            connect-timeout: 5000
            read-timeout: 15000
          github-user-client:
            connect-timeout: 5000
            read-timeout: 15000

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
    com.alibaba.nacos.plugin: WARN
    com.dayz.sc.common.web.filter.ApiRequestDebugLoggingFilter: INFO

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,diskSpace
springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.dayz.sc.auth
  paths-to-match: /api/**
  writer-with-order-by-keys: true

scalar:
  enabled: true

resilience4j:
  circuitbreaker:
    instances:
      sc-storage:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
  timelimiter:
    instances:
      GitHubOauthClientexchangeCodeStringStringStringStringStringString:
        timeout-duration: 15s
      GitHubUserClientgetUserStringStringString:
        timeout-duration: 15s
      GitHubUserClientlistEmailsStringStringStringintint:
        timeout-duration: 15s

edupivot:
  web:
    api-request-logging:
      enabled: ${API_REQUEST_DEBUG_LOGGING_ENABLED:false}
  security:
    trust-gateway-headers: false
    jwt:
      issuer: sc-edupivot
      access-token-ttl: 30m
      refresh-token-ttl: 7d
      private-key: "${JWT_PRIVATE_KEY}"
    public-endpoints:
      - /api/auth/google/login
      - /api/auth/github/login
      - /api/auth/register
      - /api/auth/password/login
      - /api/auth/refresh
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
      - /actuator/prometheus
      - /doc.html
      - /scalar
      - /scalar.js
      - /scalar/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /.well-known/jwks.json
      - /error
