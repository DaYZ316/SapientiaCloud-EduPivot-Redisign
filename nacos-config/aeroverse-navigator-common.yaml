server:
  port: 28081

spring:
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.dayz.aeroverse
  paths-to-match: /api/**
  writer-with-order-by-keys: true

scalar:
  enabled: true

aeroverse:
  security:
    jwt:
      issuer: aeroverse-navigator
      ttl: 7d
