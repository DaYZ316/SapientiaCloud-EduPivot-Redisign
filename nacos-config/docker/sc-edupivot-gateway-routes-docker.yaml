spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # 内部端点拦截（返回403）
            - id: block-storage-internal
              uri: no://op
              order: -100
              predicates:
                - Path=/api/storage/internal/**
              filters:
                - SetStatus=403
            - id: block-notification-internal
              uri: no://op
              order: -100
              predicates:
                - Path=/api/notifications/internal/**
              filters:
                - SetStatus=403
            # 业务路由
            - id: auth-route
              uri: lb://sc-auth
              predicates:
                - Path=/api/auth/**
            - id: notification-route
              uri: lb://sc-notification
              predicates:
                - Path=/api/notifications/**
            - id: course-courses-route
              uri: lb://sc-course
              predicates:
                - Path=/api/courses/**
            - id: course-dashboard-route
              uri: lb://sc-course
              predicates:
                - Path=/api/dashboard/**
            - id: course-enrollments-route
              uri: lb://sc-course
              predicates:
                - Path=/api/enrollments/**
            - id: course-class-sessions-route
              uri: lb://sc-course
              predicates:
                - Path=/api/class-sessions/**
            - id: course-live-practices-route
              uri: lb://sc-course
              predicates:
                - Path=/api/live-practices/**
            - id: course-chapters-route
              uri: lb://sc-course
              predicates:
                - Path=/api/chapters/**
            - id: course-forums-route
              uri: lb://sc-course
              predicates:
                - Path=/api/forums/**
            - id: course-question-banks-route
              uri: lb://sc-course
              predicates:
                - Path=/api/question-banks/**
            - id: course-invitations-route
              uri: lb://sc-course
              predicates:
                - Path=/api/invitations/**
            - id: storage-route
              uri: lb://sc-storage
              predicates:
                - Path=/api/storage/**
            - id: ai-route
              uri: lb://sc-ai
              predicates:
                - Path=/api/ai/**
            # OpenAPI 文档路由
            - id: auth-openapi-route
              uri: lb://sc-auth
              predicates:
                - Path=/openapi/auth
              filters:
                - SetPath=/v3/api-docs
            - id: notification-openapi-route
              uri: lb://sc-notification
              predicates:
                - Path=/openapi/notification
              filters:
                - SetPath=/v3/api-docs
            - id: course-openapi-route
              uri: lb://sc-course
              predicates:
                - Path=/openapi/course
              filters:
                - SetPath=/v3/api-docs
            - id: storage-openapi-route
              uri: lb://sc-storage
              predicates:
                - Path=/openapi/storage
              filters:
                - SetPath=/v3/api-docs
            - id: ai-openapi-route
              uri: lb://sc-ai
              predicates:
                - Path=/openapi/ai
              filters:
                - SetPath=/v3/api-docs
