spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/edupivot
    username: edupivot
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0

edupivot:
  ai:
    agent-search:
      gateway-base-url: ${AGENT_SEARCH_GATEWAY_BASE_URL:http://sc-gateway:39080}
