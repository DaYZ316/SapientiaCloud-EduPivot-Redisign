server:
  port: 28085

spring:
  flyway:
    table: flyway_schema_history_storage
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sc-storage
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dayz.sc.common.events.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,diskSpace
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.dayz.sc.storage
  paths-to-match: /api/**
  writer-with-order-by-keys: true

scalar:
  enabled: true

resilience4j:
  circuitbreaker:
    instances:
      courseAccess:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      sc-storage:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10

edupivot:
  security:
    trust-gateway-headers: true
    jwt:
      jwks-uri: http://sc-auth:28081/.well-known/jwks.json
    public-endpoints:
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
      - /doc.html
      - /scalar
      - /scalar.js
      - /scalar/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /error
  storage:
    expiry:
      upload-minutes: 10
      download-minutes: 30
    limits:
      avatar-bytes: 2097152
      course-cover-bytes: 5242880
      course-file-bytes: 209715200
      ai-file-bytes: 104857600
    bucket:
      media: edupivot-media
      course: edupivot-course
      ai: edupivot-ai
    cleanup-delay-ms: 3600000
