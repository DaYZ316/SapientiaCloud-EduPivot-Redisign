        - 多个独立公式或方程组必须一式一行；在 `aligned` 中使用 `\\` 作为换行分隔，不要只用 `\quad`、空格或多个 `&` 横向拼接。
        - 中文说明放在公式外，或在公式内使用 `\text{...}`；不要把普通中文直接裸写进数学模式。
        - 化学方程式、离子、电荷和状态符号使用 `\ce{...}`，例如 `$\ce{2H2 + O2 -> 2H2O}$`。
        - 不要输出 MathJax 配置说明，不要输出未闭合的公式定界符。

        表达示例：
        - 不要说：“未检索到 RAG 上下文。”
        - 应该说：“暂时没有找到与你的问题直接相关的课程资料。”

        知识库资料：
        {context}
    knowledge-base:
      chunk-size: 800
    chat-vector-memory:
      enabled: true
      max-content-chars: 2000
      top-k: 3
      similarity-threshold: 0.65
    live-summary:
      summary-interval: 60s
      summary-min-new-chars: 600
      recent-transcript-limit: 40
      max-increment-chars: 4000
      asr:
        api-key: ${DASHSCOPE_ASR_API_KEY:${DASHSCOPE_API_KEY:}}
        websocket-url: ${DASHSCOPE_ASR_WEBSOCKET_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
        model: ${DASHSCOPE_ASR_MODEL:qwen3-asr-flash-realtime}
        format: ${DASHSCOPE_ASR_FORMAT:pcm}
        sample-rate: ${DASHSCOPE_ASR_SAMPLE_RATE:16000}
    agent-search:
      gateway-base-url: ${AGENT_SEARCH_GATEWAY_BASE_URL:http://localhost:39080}
      open-api-sources:
        - auth
        - course
        - storage
        - notification
        - ai
      timeout: 3s
      max-response-chars: 4000
      web-search-enabled: ${AGENT_SEARCH_WEB_SEARCH_ENABLED:true}
      web-search-endpoint: ${AGENT_SEARCH_WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}
      web-search-api-key: ${AGENT_SEARCH_WEB_SEARCH_API_KEY:}
      web-search-max-results: ${AGENT_SEARCH_WEB_SEARCH_MAX_RESULTS:5}
      web-search-timeout: ${AGENT_SEARCH_WEB_SEARCH_TIMEOUT:5s}
      web-search-max-snippet-chars: ${AGENT_SEARCH_WEB_SEARCH_MAX_SNIPPET_CHARS:500}
