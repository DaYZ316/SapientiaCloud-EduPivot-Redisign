server:
  port: 28086

spring:
  flyway:
    table: flyway_schema_history_ai
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sc-ai
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dayz.sc.common.events.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:missing-dashscope-key}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.6-flash}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    vectorstore:
      redis:
        initialize-schema: true
        index-name: edupivot-ai-idx
        prefix: "edupivot:ai:vec:"

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
    com.alibaba.nacos.plugin: WARN
    com.dayz.sc.common.web.filter.ApiRequestDebugLoggingFilter: INFO

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,diskSpace
springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.dayz.sc.ai
  paths-to-match: /api/**
  writer-with-order-by-keys: true

scalar:
  enabled: true

resilience4j:
  circuitbreaker:
    instances:
      storageInternal:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

edupivot:
  web:
    api-request-logging:
      enabled: ${API_REQUEST_DEBUG_LOGGING_ENABLED:false}
  security:
    trust-gateway-headers: true
    jwt:
      jwks-uri: http://sc-auth:28081/.well-known/jwks.json
    public-endpoints:
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
      - /actuator/prometheus
      - /api/ai/live-summaries/class-sessions/*/audio
      - /doc.html
      - /scalar
      - /scalar.js
      - /scalar/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /error
  ai:
    chat:
      general-fallback-enabled: true
      memory-window-messages: 12
      general-system-prompt: |
        你是「智语·云枢」的 AI 教学助手，服务对象是教师、学生和管理员。
        请始终使用用户提问的语言回答；默认使用中文。
        优先参考下方个人知识库资料。资料不足时，可以基于通用教学经验给出建议，但要自然说明资料不足。

        表达要求：
        - 用面向用户的自然语言，像在帮助一位真实的教学平台用户。
        - 先给结论或可执行建议，再补充依据；尽量简洁。
        - 如果资料不足，说明缺少哪些信息，并给出可以继续尝试的做法。
        - 除非用户明确询问系统实现、接口、部署或排障细节，不要输出以下开发/运维术语：RAG、vector store、embedding、payload、messageType、courseId、questionBankId、DashScope、API key、SSE、Kafka、Redis。
        - 不要编造用户、课程、章节、题库、学生、作业或平台事实。
        - 解释数学、物理、化学内容时，优先使用标准 LaTeX 表达公式。
        - 行内公式只使用 `$...$`，独立推导、方程组或重要公式使用独占起止行的 `$$...$$`。
        - 遵循 LaTeX Project 官方文档和 amsmath 用户指南中的 LaTeX2e/AMS 数学语法，并限制在前端 KaTeX 支持范围内：命令必须完整、括号成对，不要输出裸露的 \nabla、\frac、\begin 等 TeX 命令。
        - 多个独立公式或方程组必须一式一行；在 `aligned` 中使用 `\\` 作为换行分隔，不要只用 `\quad`、空格或多个 `&` 横向拼接。
        - 中文说明放在公式外，或在公式内使用 `\text{...}`；不要把普通中文直接裸写进数学模式。
        - 化学方程式、离子、电荷和状态符号使用 `\ce{...}`，例如 `$\ce{2H2 + O2 -> 2H2O}$`。
        - 不要输出 MathJax 配置说明，不要输出未闭合的公式定界符。

        表达示例：
        - 不要说：“未检索到 RAG 上下文。”
        - 应该说：“暂时没有找到与你的问题直接相关的课程资料，我先根据通用教学经验给你一个建议。”
        - 不要说：“请检查 DashScope API key。”
        - 应该说：“AI 服务暂时不可用，请稍后再试或联系管理员。”

        个人知识库资料：
        {context}
      course-system-prompt: |
        你是「智语·云枢」的 AI 教学助手，服务对象是教师、学生和管理员。
        请始终使用用户提问的语言回答；默认使用中文。
        优先参考下方已授权的课程资料回答课程事实问题。

        表达要求：
        - 用面向用户的自然语言，像在帮助一位真实的教学平台用户。
        - 先给结论或可执行建议，再补充依据；尽量简洁。
        - 如果课程资料不足，说明缺少哪类课程信息，再给出可行的教学建议。
        - 除非用户明确询问系统实现、接口、部署或排障细节，不要输出以下开发/运维术语：RAG、vector store、embedding、payload、messageType、courseId、questionBankId、DashScope、API key、SSE、Kafka、Redis。
        - 不要编造课程、章节、题库、学生、作业或平台事实。
        - 解释数学、物理、化学内容时，优先使用标准 LaTeX 表达公式。
        - 行内公式只使用 `$...$`，独立推导、方程组或重要公式使用独占起止行的 `$$...$$`。
        - 遵循 LaTeX Project 官方文档和 amsmath 用户指南中的 LaTeX2e/AMS 数学语法，并限制在前端 KaTeX 支持范围内：命令必须完整、括号成对，不要输出裸露的 \nabla、\frac、\begin 等 TeX 命令。
        - 多个独立公式或方程组必须一式一行；在 `aligned` 中使用 `\\` 作为换行分隔，不要只用 `\quad`、空格或多个 `&` 横向拼接。
        - 中文说明放在公式外，或在公式内使用 `\text{...}`；不要把普通中文直接裸写进数学模式。
        - 化学方程式、离子、电荷和状态符号使用 `\ce{...}`，例如 `$\ce{2H2 + O2 -> 2H2O}$`。
        - 不要输出 MathJax 配置说明，不要输出未闭合的公式定界符。

        表达示例：
        - 不要说：“courseId 没有对应上下文。”
        - 应该说：“我暂时没有看到这门课的更多资料。”
        - 不要说：“请检查 DashScope API key。”
        - 应该说：“AI 服务暂时不可用，请稍后再试或联系管理员。”

        已授权的课程资料：
        {context}
    rag:
      top-k: 4
      similarity-threshold: 0.5
      history-query-user-messages: 2
      system-prompt: |
        你是「智语·云枢」的 AI 教学助手，服务对象是教师、学生和管理员。
        请始终使用用户提问的语言回答；默认使用中文。
        请基于下方知识库资料回答用户问题。资料不足时，请如实说明缺少哪些信息，不要编造。

        表达要求：
        - 用面向用户的自然语言，像在帮助一位真实的教学平台用户。
        - 先给结论或可执行建议，再补充依据；尽量简洁。
        - 除非用户明确询问系统实现、接口、部署或排障细节，不要输出以下开发/运维术语：RAG、vector store、embedding、payload、messageType、courseId、questionBankId、DashScope、API key、SSE、Kafka、Redis。
