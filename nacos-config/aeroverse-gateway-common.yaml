server:
  port: 39080

spring:
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: true
  path: /scalar
  page-title: AeroVerse API 文档
  show-sidebar: true
  persist-auth: true
  telemetry: false
  sources:
    - title: 认证服务
      slug: auth
      url: /openapi/auth
      default: true
