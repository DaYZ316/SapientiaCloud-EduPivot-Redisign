spring:
  application:
    name: aeroverse-navigator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:nacos:aeroverse-navigator-common.yaml?group=AEROVERSE_NAVIGATOR&refreshEnabled=true

---
spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:nacos:aeroverse-navigator-infra-local.yaml?group=AEROVERSE_LOCAL&refreshEnabled=false
      - optional:nacos:aeroverse-navigator-auth-local.yaml?group=AEROVERSE_LOCAL&refreshEnabled=false

---
spring:
  config:
    activate:
      on-profile: docker
    import:
      - optional:nacos:aeroverse-navigator-infra-docker.yaml?group=AEROVERSE_DOCKER&refreshEnabled=false
      - optional:nacos:aeroverse-navigator-auth-docker.yaml?group=AEROVERSE_DOCKER&refreshEnabled=false
